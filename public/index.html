<!DOCTYPE html>
<html>
<head>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mbarara University login </title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<form id="application-form">
      
      <div class="login-container">

		<img src="campus_logo.png" alt="MUST University Logo" class="university-logo">


	<h1>Mbarara University of Science and Technology</h1>
	<p> Welcome </p>
<form action="/applications" method="POST">

    <label>Full Name</label>

    <input type="email" name="email" required>

    <label>Programme</label>
    <input type="text" name="programme" required>

    <button type="submit">Submit Application</button>

</form>
 <p>
            Register?

        </p>


<p class="footer">@support email</p>

 <p id = "message">	</p>

</div>
 <script src="app.js" type="text/javascript"></script>

</body>
</html>
