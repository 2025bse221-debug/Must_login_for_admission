<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mbarara University Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <img src="campus_logo.png"
             alt="MUST University Logo"
             class="university-logo">

        <h1>Mbarara University of Science and Technology</h1>

        <p>Welcome</p>

        <form id="application-form"
              action="/applications"
              method="POST">

            <label>Full Name</label>

            <input type="text"
                   id="fullName"
                   name="fullName"
                   required>

            <label>Email</label>

            <input type="email"
                   id="email"
                   name="email"
                   required>

            <label>Programme</label>

            <input type="text"
                   id="programme"
                   name="programme"
                   required>

            <button type="submit">Submit Application</button>

        </form>

        <p>
            Register?
            <a href="register.html">Register Now</a>
        </p>

        <p class="footer">@support email</p>

        <p id="message"></p>

    </div>

    <script src="app.js"></script>

</body>
</html>
